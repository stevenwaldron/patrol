# Sites Patrol monitors. Adding a site = a reviewed commit (GitOps).
# id: lowercase letters, digits and dashes; used as the DynamoDB key and metric label.
sites:
  - id: cloudforger
    name: CloudForger (Cloud Architecture Platform)
    url: https://du8elo92f6be7.cloudfront.net
    timeout_seconds: 10

  - id: chess
    name: 3D Multiplayer Chess
    url: https://db60qckpdzhxr.cloudfront.net
    timeout_seconds: 10

  # Deliberately broken: ".invalid" is reserved (RFC 2606) and can never resolve,
