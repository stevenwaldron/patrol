# Dependabot opens PRs to keep pinned versions current; each one runs through CI.
version: 2
updates:
  # GitHub Actions: bumps the commit SHA pins (and the version comments next to them).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Python base image, pinned by digest in app/Dockerfile.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  # Python dependencies (exact pins in app/requirements*.txt).
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
