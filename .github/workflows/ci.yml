# Checks on every pull request and every push to main. No AWS access here:
# nothing in this workflow can change anything outside GitHub.
#
# Every third-party action is pinned to a full commit SHA, never a tag: in
# March 2026 attackers rewrote 76 of trivy-action's 77 version tags to steal CI
# secrets (GHSA-69fq-xp46-6x23). A commit SHA can't be moved. Dependabot keeps
# the pins current through reviewed PRs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  KUBERNETES_VERSION: 1.36.0
  TERRAFORM_VERSION: 1.17.1
  TRIVY_VERSION: v0.70.0
  PROMETHEUS_VERSION: 3.15.1
  ALERTMANAGER_VERSION: 0.34.2      # same as the cluster runs (kube-prometheus-stack 92.17.0)
  KPS_CHART_VERSION: 92.17.0
  KYVERNO_VERSION: v1.19.2          # CLI = the Kyverno the cluster runs (chart 3.9.2)
  KYVERNO_CHART_VERSION: 3.9.2
  # Schemas for custom resources (ServiceMonitor, PrometheusRule, ExternalSecret,
  # Argo CD Application...), so they get the same strict check as built-in ones.
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - name: pytest
        working-directory: app
        run: python -m pytest

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "${base}/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: helm lint
        run: helm lint deploy/charts/patrol --namespace patrol
      - name: Render (HTTPS and plain-HTTP modes) and validate against Kubernetes schemas
        run: |
          helm template patrol deploy/charts/patrol --namespace patrol > rendered-https.yaml
          helm template patrol deploy/charts/patrol --namespace patrol --set ingress.host= > rendered-http.yaml
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$CRD_SCHEMAS" \
            rendered-https.yaml rendered-http.yaml
      - name: Validate platform manifests (secrets, policies, Argo CD apps)
        # Named paths, not all of deploy/platform: that folder also holds Helm
        # values files and the policies' test fixtures, which aren't manifests.
        run: |
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$CRD_SCHEMAS" \
            deploy/platform/secrets deploy/platform/policies/*.yaml \
            deploy/argocd/root-app.yaml deploy/argocd/apps
      - name: Guard rails still refuse bad input
        # (Not "! helm ...": under bash -e a "!"-prefixed command never fails the step.)
        run: |
          if helm template patrol deploy/charts/patrol --namespace default >/dev/null 2>&1; then
            echo "Chart rendered in the wrong namespace; the guard is broken" >&2; exit 1
          fi
          if helm template patrol deploy/charts/patrol --namespace patrol --set image.tag=latest >/dev/null 2>&1; then
            echo "Chart accepted image.tag=latest; the schema guard is broken" >&2; exit 1
          fi

  monitoring:
    # Patrol's alert rules are tested like code: syntax, unit tests (fake metric
    # histories in, exact alerts out), and the Alertmanager config the cluster
    # will actually run, rendered from the real chart and checked with amtool.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install promtool and amtool (checksums verified)
        run: |
          cd "$RUNNER_TEMP"
          p="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${p}.tar.gz"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/sha256sums.txt" | grep " ${p}.tar.gz$" | sha256sum -c -
          tar xzf "${p}.tar.gz" --strip-components=1 "${p}/promtool"
          a="alertmanager-${ALERTMANAGER_VERSION}.linux-amd64"
          curl -fsSLO "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/${a}.tar.gz"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/sha256sums.txt" | grep " ${a}.tar.gz$" | sha256sum -c -
          tar xzf "${a}.tar.gz" --strip-components=1 "${a}/amtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Rules syntax
        run: promtool check rules deploy/charts/patrol/files/prometheus-rules.yaml
      - name: Rules unit tests
        run: promtool test rules deploy/monitoring/tests/patrol-rules.test.yaml
      - name: Dashboards are generated from their source
        run: |
          python3 deploy/monitoring/dashboards-src/build_dashboards.py
          git diff --exit-code -- deploy/charts/patrol/files/dashboards \
            || { echo "Dashboards out of date: run build_dashboards.py and commit the JSON" >&2; exit 1; }
      - name: Alertmanager config (rendered from the real chart) + routing
        run: |
          helm template kps kube-prometheus-stack --repo https://prometheus-community.github.io/helm-charts \
            --version "$KPS_CHART_VERSION" --namespace monitoring \
            -f deploy/monitoring/kube-prometheus-stack-values.yaml > kps.yaml
          python3 - <<'PY'
          import base64, yaml
          docs = [d for d in yaml.safe_load_all(open("kps.yaml")) if d]
          sec = next(d for d in docs if d["kind"] == "Secret" and d["metadata"]["name"].endswith("-alertmanager"))
          cfg = base64.b64decode(sec["data"]["alertmanager.yaml"]).decode()
          # The webhook file only exists in the cluster; point at a stand-in here.
          cfg = cfg.replace("/etc/alertmanager/secrets/", "/tmp/am-secrets/")
          open("am.yaml", "w").write(cfg)
          PY
          mkdir -p /tmp/am-secrets/alertmanager-slack
          echo "https://hooks.slack.com/services/T0/B0/x" > /tmp/am-secrets/alertmanager-slack/slack-webhook-url
          amtool check-config am.yaml
          expect() {  # expect RECEIVER label=value...
            want=$1; shift
            got=$(amtool config routes test --config.file=am.yaml "$@")
            echo "$* -> $got"
            [ "$got" = "$want" ] || { echo "expected $want" >&2; exit 1; }
          }
          expect slack alertname=PatrolSiteDown severity=warning site=chess
          expect slack alertname=PatrolChecksStale severity=critical site=chess
          expect null  alertname=Watchdog severity=none
          expect null  alertname=CPUThrottlingHigh severity=info
          expect slack alertname=TargetDown severity=warning namespace=kyverno
      - name: Every Secret and ConfigMap a monitoring pod needs exists
        run: python3 deploy/monitoring/check_references.py kps.yaml

  policies:
    # Kyverno policies are tested like code: each rule against pods built to
    # break it, and every policy (Patrol's own + the Pod Security "restricted"
    # library that Pod Security Admission also enforces) against the chart Argo
    # CD will deploy. A chart change that would be rejected in the cluster fails
    # here first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install the Kyverno CLI (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          file="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          base="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}"
          curl -fsSLO "${base}/${file}"
          curl -fsSL "${base}/checksums.txt" | grep " ${file}\$" | sha256sum -c -
          tar xzf "$file" kyverno
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Policy tests (good pods pass, each bad pod fails its rule)
        run: kyverno test deploy/platform/policies/tests
      - name: Patrol's chart passes every policy
        run: |
          helm template patrol deploy/charts/patrol --namespace patrol > patrol.yaml
          # helm template leaves metadata.namespace empty; the policies select
          # the patrol namespace, so set it the way Argo CD will.
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("patrol.yaml")) if d]
          for d in docs:
              d["metadata"].setdefault("namespace", "patrol")
          yaml.safe_dump_all(docs, open("patrol.yaml", "w"), sort_keys=False)
          PY
          helm template kyverno-policies kyverno-policies --repo https://kyverno.github.io/kyverno \
            --version "$KYVERNO_CHART_VERSION" --namespace kyverno \
            -f deploy/platform/policy-library/values.yaml > library.yaml
          # Exits non-zero on any failed check (Audit policies included).
          kyverno apply deploy/platform/policies/*.yaml library.yaml --resource patrol.yaml \
            --values-file deploy/platform/policies/tests/values.yaml | tee apply.txt
          # Guard against "passes" because nothing matched (e.g. a selector typo).
          grep -Eq 'pass: [1-9][0-9]*, fail: 0' apply.txt \
            || { echo "No policy matched Patrol's workloads: check the selectors" >&2; exit 1; }
      - name: Kyverno chart renders with our settings
        run: |
          helm template kyverno kyverno --repo https://kyverno.github.io/kyverno \
            --version "$KYVERNO_CHART_VERSION" --namespace kyverno \
            -f deploy/platform/kyverno/values.yaml > kyverno.yaml
          grep -q -- '--forceFailurePolicyIgnore=true' kyverno.yaml \
            || { echo "Kyverno webhooks are not forced to failurePolicy Ignore" >&2; exit 1; }
          python3 deploy/monitoring/check_references.py kyverno.yaml

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (preinstalled on GitHub's Ubuntu runners)
        run: shellcheck --version && shellcheck app/*.sh infra/*.sh

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/bootstrap, infra/permanent, infra/cluster]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}
      - name: validate (no backend, no AWS credentials)
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  images:
    # Build every image and scan it, without pushing. Catches a failing build or
    # a fixable HIGH/CRITICAL vulnerability before it reaches main.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [scheduler, worker, status-page]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          target: ${{ matrix.service }}
          platforms: linux/amd64
          load: true
          push: false
          tags: patrol/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy (fail on HIGH/CRITICAL that have a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: patrol/${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
