# How Karpenter builds a node for Patrol's workers. Names and tags match
# Terraform (infra/cluster/karpenter.tf and the karpenter.sh/discovery tags).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: workers
spec:
  # Amazon Linux 2023, the same OS as the managed nodes. `@latest` resolves to
  # the newest EKS-optimized AMI for the cluster's Kubernetes version when a
  # node launches. Trade-off: no pinned AMI. Acceptable here because nodes live
  # at most one session (and 7 days by NodePool expiry); production would pin a
  # version (al2023@vYYYYMMDD) and roll it forward deliberately.
  amiSelectorTerms:
    - alias: al2023@latest
  # Instance profile created by Terraform (so Karpenter never creates one that
  # teardown could miss).
  instanceProfile: patrol-karpenter-node
  # Private subnets and the managed nodes' security group, found by tag.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: patrol
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: patrol
  # IMDSv2 only, hop limit 1: pods can't borrow the node's AWS credentials
  # (same as the managed nodes).
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: patrol
    Layer: karpenter
