# Test pods for Patrol's policies: one good pod, then one bad pod per rule
# (each breaks exactly one rule), plus a pod in another namespace (out of scope).
apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: patrol
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: 419701112481.dkr.ecr.us-east-1.amazonaws.com/patrol/worker:808598b
    securityContext:
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 128Mi
---
