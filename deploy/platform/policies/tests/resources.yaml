kind: Pod
metadata:
  name: good-digest
  namespace: patrol
spec:
  automountServiceAccountToken: false
  containers:
  - name: app
    image: 419701112481.dkr.ecr.us-east-1.amazonaws.com/patrol/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    securityContext:
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 128Mi
---
