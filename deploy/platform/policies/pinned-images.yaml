apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: patrol-pinned-images
  annotations:
    policies.kyverno.io/title: Patrol images pinned to a commit or digest
    policies.kyverno.io/description: >-
      Every image tag must be the git commit ID it was built from (7-40 hex characters), or the image must be pinned by digest. Tags like latest can silently point at different images over time.
spec:
  # Audit: record results in PolicyReports, block nothing. Switched to Deny once
  # the reports show Patrol passes (see the running log).
  validationActions: [Audit]
  failurePolicy: Ignore          # Pod Security Admission is the backstop
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: patrol
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    # The tag is whatever follows the last ':' after the last '/' (so a registry
    # port like host:5000/... isn't mistaken for a tag).
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@sha256:') ||
          c.image.split('/')[size(c.image.split('/')) - 1].matches('^[^:]+:[0-9a-f]{7,40}$'))
      messageExpression: >-
        'image tags must be a git commit ID (or pin by @sha256 digest); not allowed: ' +
        variables.containers.filter(c, !(c.image.contains('@sha256:') ||
          c.image.split('/')[size(c.image.split('/')) - 1].matches('^[^:]+:[0-9a-f]{7,40}$'))).map(c, c.image).join(', ')
