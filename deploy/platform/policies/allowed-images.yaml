apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: patrol-allowed-images
  annotations:
    policies.kyverno.io/title: Patrol images only from Patrol's ECR
    policies.kyverno.io/description: >-
      Every container image must come from Patrol's own ECR repositories (419701112481.dkr.ecr.us-east-1.amazonaws.com/patrol/...). Blocks Docker Hub and any other registry, including look-alike names.
spec:
  # Deny: reject anything in the patrol namespace that breaks this rule. Ran in
  # Audit first; the live PolicyReports showed every Patrol workload passing all
  # 22 policies (Nov 6) before this was switched. Audit is also kept, so passes
  # and failures keep appearing in PolicyReports.
  validationActions: [Deny, Audit]
  failurePolicy: Ignore          # Pod Security Admission is the backstop
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: patrol
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('419701112481.dkr.ecr.us-east-1.amazonaws.com/patrol/'))
      messageExpression: >-
        'images must come from 419701112481.dkr.ecr.us-east-1.amazonaws.com/patrol/; not allowed: ' +
        variables.containers.filter(c,
          !c.image.startsWith('419701112481.dkr.ecr.us-east-1.amazonaws.com/patrol/')).map(c, c.image).join(', ')
