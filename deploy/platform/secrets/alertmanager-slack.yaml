# The Slack incoming-webhook URL, copied from Secrets Manager into a Kubernetes
# Secret that only Alertmanager mounts. Alertmanager reads it from a FILE
# (api_url_file), so the URL never appears in Git, Helm values or Argo CD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: patrol/slack-webhook
