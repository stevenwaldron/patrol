# Where ExternalSecrets in the monitoring namespace read from. No "auth" block:
# ESO uses its own pod's AWS credentials (EKS Pod Identity), which can read only
# the patrol/slack-webhook secret. A namespaced SecretStore (not a
# ClusterSecretStore) so only this namespace can use it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
