# Grafana's admin password: generated INSIDE the cluster, once per rebuild, by
# ESO's Password generator. Never in Git. (Rejected letting the Grafana chart
# generate it: under Argo CD the chart would generate a new one on every sync,
# showing permanent drift and changing the password under you.)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  length: 32
  digits: 6
  symbols: 0      # alphanumeric: easy to paste, still ~190 bits of randomness
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  # 0 = generate once and never rotate (a rotating admin password would log you out).
  refreshInterval: "0"
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin
