# Karpenter (chart 1.15.1 = Karpenter 1.15.1): launches EC2 nodes when pods
# don't fit, and removes or repacks them when they're no longer needed. Here it
# runs the worker node pool (deploy/platform/karpenter-nodes); the platform stays
# on the managed node group, which also runs Karpenter itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    # Wave 0, alongside Kyverno and KEDA: its ServiceMonitor needs the
    # monitoring stack's CRDs (wave -1); the node pool (wave 1) needs its CRDs.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  sources:
    # Karpenter publishes its chart only to a public OCI registry. Argo CD's
    # form for that: the registry path without "oci://", plus the chart name.
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.15.1
      helm:
        releaseName: karpenter
        valueFiles:
          - $values/deploy/platform/karpenter/values.yaml
    - repoURL: https://github.com/stevenwaldron/patrol.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Karpenter's documented location; the Pod Identity association
    # (infra/cluster/karpenter.tf) is for kube-system/karpenter.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # Karpenter's CRDs are too large for client-side apply
