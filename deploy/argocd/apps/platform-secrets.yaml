# Secrets the monitoring stack needs, created by External Secrets (wave -2) before
# the monitoring stack starts using them (both are wave -1; pods wait for their
# Secret to appear, so the order inside the wave doesn't matter).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/stevenwaldron/patrol.git
    targetRevision: main
    path: deploy/platform/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
