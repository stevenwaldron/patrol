# External Secrets Operator (chart 2.14.0 = ESO v2.14.0). Copies secrets from
# AWS Secrets Manager into Kubernetes Secrets, so no secret value is ever stored
# in Git or Helm values. Its AWS access is the Pod Identity role
# patrol-external-secrets, which can read ONLY patrol/slack-webhook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave -2: its CRDs and webhook must exist before anything uses ExternalSecrets.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets   # must match the Pod Identity association
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 192Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets   # the IAM role only trusts this namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # ESO's CRDs are too large for client-side apply
