# Patrol chart values: the "spec sheet" Helm copies into every template.
# Deploying new code = changing image.tag here in a reviewed commit; Argo CD does the rest.

# The IAM roles (infra/permanent/iam-pod-roles.tf) only trust ServiceAccounts in
# this namespace, so the chart refuses to render anywhere else.
expectedNamespace: patrol

image:
  registry: 419701112481.dkr.ecr.us-east-1.amazonaws.com
  # Git commit ID the images were built from (./app/push-images.sh prints it).
  tag: "f18ee0b"
  pullPolicy: IfNotPresent

aws:
  region: us-east-1
  queueUrl: https://sqs.us-east-1.amazonaws.com/419701112481/patrol-checks
  tableName: patrol-checks

# Sites to monitor. Must match config/sites.yaml (used for local runs);
# app/tests/test_chart_sites.py fails if the two ever drift apart.
sites:
  - id: cloudforger
    name: CloudForger (Cloud Architecture Platform)
    url: https://du8elo92f6be7.cloudfront.net
    timeout_seconds: 10
  - id: chess
    name: 3D Multiplayer Chess
    url: https://db60qckpdzhxr.cloudfront.net
    timeout_seconds: 10
  - id: broken-test
    name: Broken test site (always down, on purpose)
    url: https://patrol-broken-test.invalid
    timeout_seconds: 5

scheduler:
  schedule: "* * * * *"          # every minute
  # A run takes about a second; anything near this means something is stuck.
  activeDeadlineSeconds: 50
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 192Mi }

worker:
  # Fixed copies when autoscaling is off. With autoscaling on, KEDA owns the
  # count and the Deployment leaves `replicas` out (otherwise Argo CD and the
  # autoscaler would fight over it forever).
  replicas: 2
  threads: 10
  # Run on Karpenter's "workers" node pool (Spot first; deploy/platform/
  # karpenter-nodes): a node selector plus a toleration for the pool's taint.
  # Empty = no preference (the managed nodes, as before Phase 8).
  nodePool: workers
  # KEDA scales the workers on the SQS queue's length (waiting + in-progress
  # orders), not CPU: checks spend their time waiting on the network, so CPU
  # never shows a backlog. Needs KEDA (deploy/argocd/apps/keda.yaml).
  autoscaling:
    enabled: true
    # 2 keeps one worker per zone (topology spread) and the disruption budget
    # meaningful; orders arrive every minute, so scale-to-zero buys nothing.
    minReplicas: 2
    maxReplicas: 10
    # Target orders per worker. One worker runs `threads` (10) checks at a time,
    # each up to ~10 s, so 20 queued is a couple of rounds of work.
    ordersPerWorker: 20
    pollingIntervalSeconds: 15
    # Wait this long after the backlog clears before removing workers, so a
    # bursty queue doesn't make the count flap.
    scaleDownStabilizationSeconds: 120
  # Long poll (20 s) + slowest check must finish before Kubernetes force-stops the pod.
  terminationGracePeriodSeconds: 60
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

statusPage:
  replicas: 2
  terminationGracePeriodSeconds: 30
  # Pause before shutdown so the load balancer stops sending requests first.
  preStopSleepSeconds: 10
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: true
  className: alb
  loadBalancerName: patrol
  # Public hostname. When set: HTTPS on 443 with the ACM certificate the
  # controller finds for this name, HTTP redirected to HTTPS, and ExternalDNS
  # points the name at the ALB. Empty = plain HTTP on the ALB's own address.
  host: mypatrolapp.cloud
  # AWS's TLS 1.3 + 1.2 policy (no TLS 1.0/1.1).
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  # ALB waits this long for in-flight requests when a pod leaves (AWS default is 300 s).
  deregistrationDelaySeconds: 30

monitoring:
  # ServiceMonitors, alert rules and dashboards (needs kube-prometheus-stack).
  enabled: true
  scrapeInterval: 30s

# Phase 9 failure drills (docs/drills.md). Leave both at their defaults; a drill
# changes one in a commit and its revert commit puts it back.
drill:
  # Replace a site's URL in the cluster (e.g. chess: https://patrol-drill.invalid)
  # to simulate that site going down. `sites` above stays untouched.
  siteUrlOverrides: {}
  # Stop the scheduler: no new orders, so check freshness decays.
  schedulerSuspended: true
