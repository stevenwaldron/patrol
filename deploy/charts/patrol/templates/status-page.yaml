{{- $c := dict "root" . "component" "status-page" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  labels:
    {{- include "patrol.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.statusPage.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" $c | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start a new copy before removing an old one: never below full strength.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "patrol.labels" $c | nindent 8 }}
      annotations:
        {{- include "patrol.sitesChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: status-page
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.statusPage.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "patrol.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "patrol.topologySpread" $c | nindent 8 }}
      containers:
        - name: status-page
          image: {{ include "patrol.image" $c }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "patrol.awsEnv" . | nindent 12 }}
            - name: PATROL_SITES_FILE
              value: /app/config/sites.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Ready = config loaded and able to serve (deliberately not a DynamoDB check).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # On shutdown, keep serving briefly while the load balancer stops sending
          # new requests, so no visitor hits a pod that's already gone.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.statusPage.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.statusPage.resources | nindent 12 }}
          securityContext:
            {{- include "patrol.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: sites
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sites
          configMap:
            name: patrol-sites
        {{- include "patrol.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  labels:
    {{- include "patrol.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "patrol.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: status-page
  labels:
    {{- include "patrol.labels" $c | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "patrol.selectorLabels" $c | nindent 6 }}
