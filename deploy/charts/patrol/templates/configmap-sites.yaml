apiVersion: v1
kind: ConfigMap
metadata:
  name: patrol-sites
  labels:
    {{- include "patrol.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  sites.yaml: |
    # Generated from the Helm chart's values (sites). Edit values.yaml, not this.
    {{- dict "sites" .Values.sites | toYaml | nindent 4 }}
