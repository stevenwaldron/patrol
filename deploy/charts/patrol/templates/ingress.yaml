{{- if .Values.ingress.enabled }}
{{- $c := dict "root" . "component" "status-page" }}
# The AWS Load Balancer Controller turns this into an internet-facing ALB.
# IP target mode: the ALB sends traffic straight to status-page pod IPs
# (using the Service's endpoint list), skipping an extra hop through the nodes.
# With ingress.host set: HTTPS (443) with the ACM certificate the controller
# discovers for that hostname, HTTP (80) answers with a redirect to HTTPS, and
# ExternalDNS points the hostname at this ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-page
  labels:
    {{- include "patrol.labels" $c | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.loadBalancerName | quote }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    {{- if .Values.ingress.host }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.ingress.sslPolicy | quote }}
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
    alb.ingress.kubernetes.io/healthcheck-path: /ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds={{ .Values.ingress.deregistrationDelaySeconds }}
    alb.ingress.kubernetes.io/tags: Project=patrol,Layer=cluster
    # /metrics is for Prometheus inside the cluster, not the internet:
    # the ALB answers 404 itself and never forwards it to a pod.
    alb.ingress.kubernetes.io/actions.block-metrics: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"not found"}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: block-metrics
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: status-page
                port:
                  name: http
{{- end }}
