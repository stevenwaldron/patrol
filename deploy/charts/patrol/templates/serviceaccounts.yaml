{{- include "patrol.guard" . }}
{{- /*
One badge per service. The names must match the Pod Identity associations
(infra/permanent/iam-pod-roles.tf), which is how each pod gets its own AWS role.
The Kubernetes API token is not mounted: no Patrol pod talks to the Kubernetes API,
and AWS credentials arrive through Pod Identity's own token instead.
*/}}
{{- range $component := list "scheduler" "worker" "status-page" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component }}
  labels:
    {{- include "patrol.labels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
